name: Deploy Backend to Cloud Run

# いつ動くか：mainブランチにPushされたとき
on:
  push:
    branches:
      - main
    # 以下のファイルに変更があった時だけ動く（無駄な動作を防ぐ）
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'Dockerfile'
      - '.github/workflows/deploy-backend.yml'

# 変数設定（GCPで作った設定に合わせる）
env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-northeast1
  REPO_NAME: typecast-repo
  SERVICE_NAME: typecast-api

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. コードを取ってくる
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. GCPにログイン（JSON鍵を使う）
      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 3. Cloud SDKのセットアップ
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 4. Dockerの認証設定
      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      # 5. ビルドしてArtifact Registryにプッシュ
      - name: Build and Push Docker image
        run: |
          IMAGE_TAG=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      # 6. Cloud Runへデプロイ
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE_TAG }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},TMDB_API_KEY=${{ secrets.TMDB_API_KEY }},VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }},FIRESTORE_DB_NAME=${{ secrets.FIRESTORE_DB_NAME }}